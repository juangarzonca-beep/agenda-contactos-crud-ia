<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">Agenda de Contactos IA</h1>

    <!-- Formulario de contacto -->
    <div class="card mb-4">
      <div class="card-header">Agregar / Editar Contacto</div>
      <div class="card-body">
        <form id="contactForm" novalidate>
          <input type="hidden" id="contactId" />
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="name" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="name" required />
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="phone" required />
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="email" class="form-label">Correo</label>
              <input type="email" class="form-control" id="email" required />
            </div>
            <div class="col-md-6">
              <label for="category" class="form-label">Categoría</label>
              <select class="form-select" id="category" required>
                <option value="Trabajo">Trabajo</option>
                <option value="Familia">Familia</option>
                <option value="Amigos">Amigos</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Guardar Contacto</button>
          <button type="button" id="cancelEdit" class="btn btn-secondary d-none">Cancelar</button>
        </form>
      </div>
    </div>

    <!-- Buscador y lista de contactos -->
    <div class="mb-3 d-flex justify-content-between align-items-center">
      <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre..." />
    </div>
    <div id="contactsContainer" class="row"></div>
  </div>
